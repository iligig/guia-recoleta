<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recoleta · Guía del cementerio</title>
  <meta name="description" content="Mapa de las tumbas más interesantes del Cementerio de la Recoleta, con sus historias.">
  <meta name="theme-color" content="#2f3a2f">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <!-- Il "?v=" è la versione: quando cambiano style.css o app.js va aumentata,
       così i telefoni scaricano subito i file nuovi invece di usare la copia in memoria -->
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- La barra in alto: titolo e scelta della lingua -->
  <header class="barra">
    <h1 id="titolo">Cementerio de la Recoleta</h1>
    <select id="scelta-lingua" class="lingue" aria-label="Idioma · Language · Lingua">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="it">Italiano</option>
    </select>
  </header>

  <!-- La mappa -->
  <main id="mappa"></main>

  <!-- I due pulsanti in basso -->
  <div class="comandi">
    <button type="button" id="bottone-elenco" class="bottone-tondo"></button>
    <button type="button" id="bottone-posizione" class="bottone-tondo"></button>
    <button type="button" id="bottone-info" class="bottone-tondo bottone-info">i</button>
  </div>

  <!-- La scheda che si apre dal basso: una tomba oppure l'elenco -->
  <section id="scheda" class="scheda" hidden>
    <button type="button" id="chiudi-scheda" class="chiudi">×</button>
    <div id="contenuto-scheda"></div>
  </section>

  <!-- Brevi messaggi (per esempio "sto cercando la tua posizione") -->
  <div id="avviso" class="avviso" role="status" hidden></div>

  <noscript>Esta guía necesita JavaScript.</noscript>

  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"
          integrity="sha384-nXMl9YiLoSG5KBPTFgvxVuIqQQcqIvo0bFrvoEaGJC6r7IibIzF1S36Zbf/sKBtL" crossorigin="anonymous"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
